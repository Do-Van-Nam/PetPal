name: Build & Distribute

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Android ───────────────────────────────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      
      - name: Debug secrets securely
        run: |
          echo "=== Check Android Secrets Length ==="
          echo "=== Check Android Secrets Length ==="
          echo "ANDROID_KEYSTORE_BASE64 length: ${#SECRET_KEYSTORE_B64}"
          echo "KEYSTORE_PASSWORD length: ${#SECRET_KEY_PASS}"
          echo "KEY_PASSWORD length: ${#SECRET_KEY_ALIAS_PASS}"
          echo "KEY_ALIAS length: ${#SECRET_KEY_ALIAS}"
          echo "FIREBASE_SERVICE_ACCOUNT length: ${#SECRET_FIREBASE_SERVICE}"
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS_PASS: ${{ secrets.KEY_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_FIREBASE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - run: flutter pub get
      # - run: flutter analyze
      # - run: flutter test

      # Decode keystore
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      # Tạo key.properties
      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      # Decode Firebase service account
      - name: Setup Firebase credentials
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > android/fastlane/service-account.json

          echo "=== Firebase service account file info ==="
          ls -la android/fastlane/service-account.json
          head -c 200 android/fastlane/service-account.json | cat

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          working-directory: android
          bundler-cache: true
          ruby-version: '3.1'

      - name: Install dependencies
        working-directory: android
        run: bundle install

      - name: Distribute to Firebase
        working-directory: android
        env:
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
        run: bundle exec fastlane distribute

  # ─── iOS (cần macOS) ───────────────────────────
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - run: flutter pub get

      - name: Setup Firebase credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > ios/fastlane/service-account.json

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ios
          bundler-cache: true
          ruby-version: '3.1'

      # - name: Distribute to Firebase
      #   working-directory: ios
      #   env:
      #     FIREBASE_APP_ID_IOS: ${{ secrets.FIREBASE_APP_ID_IOS }}
      #   run: bundle exec fastlane distribute
